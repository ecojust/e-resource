    <h1>巨鹿路334号院内尖山墙窗与双坡瓦檐</h1>
      <p>巨鹿路334号院内临街可见的一开间尖山墙。两道红色斜檐在墙顶相交，浅色山面中嵌上窄下高的一组六格窗，窗台下有一段水平腰线。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">2013年与2021年的街景均可见同一尖顶、矩形窗洞与右边廊柱。模型采用2021年浅色粉刷后的外观，按窗宽约1.30米换算可见比例。两站交会角仅约4.3–4.8度，院内楼号、原始建造年代、瓦的背面和进深尚欠实测。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>

      <button type="button" data-view="tiles">看上下六格窗</button>
