<!doctype html>

<head>

  <title>原犹太医院三德堂南花园石阶与半圆窗</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">

<body>
  <main id="model-view" aria-label="原犹太医院三德堂南花园石阶与半圆窗"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">徐汇区 · 汾阳路83号10号楼</p>
    <h1>原犹太医院三德堂</h1>
    <p>南花园石阶与半圆窗</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">从花园中央石阶上到半圆窗前，楼梯向两侧折返，通到二层平台。近看可以辨出扇窗的两道半环和放射状钢条。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看花园石阶</button>
      <button type="button" data-view="oblique">斜看两侧折返梯</button>
      <button type="button" data-view="above">从上方看两层平台</button>
      <button type="button" data-view="inscription">放大半圆钢扇窗</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/xuhui-jewish-hospital-garden-stair/README.md">现场照片与楼梯量测</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('xuhui-jewish-hospital-garden-stair', {
      front: {center: [0, 2.14, 2.23], size: [10.45, 4.56, 4.99], direction: [0.04, 0.28, 1]},
      oblique: {center: [0, 2.22, 2.07], size: [10.45, 4.56, 4.99], direction: [0.78, 0.44, 1]},
      above: {center: [0, 2.00, 2.18], size: [10.45, 4.56, 4.99], direction: [0.40, 1.75, 1]},
      inscription: {center: [0, 2.41, 1.43], size: [2.01, 1.81, 0.15], direction: [0.04, 0.08, 1]},
    });
  </script>
