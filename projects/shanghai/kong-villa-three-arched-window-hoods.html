    <h1>孔氏别墅园侧高低三拱窗罩与曲线托臂</h1>
      <p>园侧底层深色窗框上方的三道白色拱罩，中央挑出的拱顶较高，两侧拱顶较低，曲线托臂自窗边向外挑起。</p>

    <p class="scope">依据题名照片估整组三罩宽约3.2米。拱罩各自有外皮、薄前缘和内弧，四个支承轴按可见边线估算。照片下部受花木遮挡，窗下及室内留待实测。</p>
