    <h1>元培楼红砖转角窗与叠檐</h1>
      <p>二层元培楼的临角三樘窗、清水砖与浅色竖向线脚、转折檐口及外置雨水管。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">长立面节选约4.28米，转角返回约2.12米，高约3.13米。砖缝和型材深度属比例估算；朝向和实尺尚缺测绘控制。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>

      <button type="button" data-view="front">看红砖转角</button>
      <button type="button" data-view="oblique">看竖梃和横窗</button>
      <button type="button" data-view="tiles">看雨管折接</button>
      <button type="button" data-view="rail">看檐口回转</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
