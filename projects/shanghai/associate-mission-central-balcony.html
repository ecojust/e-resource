  <main id="model-view" aria-label="协进大楼沿街五格透花石阳台与挑托"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">黄浦区 · 圆明园路169号</p>
    <h1>协进大楼</h1>
    <p>沿街五格透花石阳台与挑托</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">灰砖立面的中间挑出一座浅石色阳台，五格放射状透栏夹在方柱之间。两只石托从外缘逐渐收回到墙侧。</p>

    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看五格透花石栏</button>
      <button type="button" data-view="oblique">斜看转角短栏与双挑托</button>
      <button type="button" data-view="above">俯看阳台叠级底板</button>
      <button type="button" data-view="arch">细看石栏中心与八向杆件</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-associate-mission-balcony/README.md">历史照片与制作范围</a>
  </aside>
