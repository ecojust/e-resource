<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>武夷路127号历史住宅 · 南立面</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <style>
    .embedded header,.embedded footer{display:none}
    .embedded #model-view{top:8px;bottom:8px}
    .embedded .panel{top:12px;bottom:12px}
    .embedded #site-return{display:block;margin-top:8px}
    @media(max-width:650px){.embedded #model-view{inset:0 0 46%}.embedded .panel{top:54%;bottom:0;max-height:none}}
  </style>
  <script>
    if(window.self!==window.top && new URLSearchParams(location.search).get('embed')==='history'){
      document.documentElement.classList.add('embedded');
      const returnToMap=event=>{event.preventDefault();parent.postMessage('close-historical-view',location.origin);};
      addEventListener('keydown',event=>{if(event.key==='Escape') returnToMap(event);});
      addEventListener('DOMContentLoaded',()=>{
        const link=document.getElementById('site-return');
        link.textContent='返回当代原址';
        link.addEventListener('click',returnToMap);
        document.querySelector('.panel').append(link);
      });
    }
  </script>
</head>
<body>
  <main id="model-view" data-oblique-x=".57" aria-label="武夷路127号历史住宅南立面三维模型"></main>
  <header>
    <a id="site-return" href="index.html#landmark=changning-wuyi-road-127-garden-front&amp;mode=overview">← 查看当代原址</a> · <a href="landmarks.html#building-changning-wuyi-road-127-garden-front">按区目录</a>
    <p>第二批优秀历史建筑 · 2M005</p>
    <h1>武夷路127号历史住宅</h1>
    <p>南侧花园立面</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p>三跨玻璃廊上方是宝瓶栏杆，折坡屋面的中央为双坡老虎窗，两翼各有一处单坡老虎窗。模型依据2018年及2024年公开的建筑资料制作，檐口、窗距和色彩按照片估计。区房管局记建于1925年，另有1932年说。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">花园正面</button>
      <button type="button" data-view="oblique">玻璃廊与宝瓶栏杆</button>
      <button type="button" data-view="above">折坡屋面与老虎窗</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/changning-wuyi-road-127-garden-front/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('changning-wuyi-road-127-garden-front');
  </script>
</body>
</html>
