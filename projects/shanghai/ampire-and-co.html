<head>

  <title>安培洋行大楼 · 上海建筑模型</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>

<body>
  <main id="model-view" data-oblique="positive-x" aria-label="安培洋行大楼东面的红砖街墙、中央挑窗和两端圆弧翼"></main>
  <header>
    <a href="index.html#landmark=huangpu-ampire-and-co-building&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">黄浦区 · 圆明园路97号</p>
    <h1>安培洋行大楼</h1>
    <p>据佳士得记载，始建于1907年 · 曾为上海广告公司用房</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">2014年的街面照片可见底层拱门、三层圆挑窗和两座三角山花。2020年发布的斜照显示，两端的半圆凸翼每层各有三扇窗。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">圆明园路正面</button>
      <button type="button" data-view="oblique">圆弧翼斜视</button>
      <button type="button" data-view="above">上方俯视</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-ampire-and-co-building/README.md">制作范围与照片来源</a>
  </aside>
