<p class="eyebrow">长宁区 · 愚园路1136弄31号</p><h1>王伯群住宅南花园双层廊</h1></header>
<main aria-label="王伯群住宅南花园双层廊三维模型" id="model-view"></main>

<p class="scope">王伯群住宅朝向南花园的一侧，下层三道拱廊承托上层五扇窗。叠阶、上下两道栏板和窗上的花饰可以分别近看。</p>

<div aria-label="下载模型" class="downloads" id="downloads"></div>
<p>住宅于1934年落成，现为长宁区少年宫。模型取面向南花园的弧廊外缘与两侧花园石梯。高位视角显示两层的开间关系，草坪视角可近看窗下的四叶透花。</p>
