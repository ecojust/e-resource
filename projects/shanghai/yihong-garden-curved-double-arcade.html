    <h1>扆虹园弧形端廊上下双券与铸铁栏杆</h1>
      <p>武进路扆虹园临园端廊，上下两层沿弯墙各开两道砖券。模型取两对通透的券孔、三道墩柱、上廊细铁栏和随弧线出挑的腰线与檐口。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">据2026年2月8日的公开实照测记当时修缮外观。单券净宽暂取1.63米，两层皆有透空；柱距、归圆半径、栏杆数量、檐与楼板进深属于比例估计。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>

      <button type="button" data-view="oblique">看红砖券与灰砖面</button>
      <button type="button" data-view="tiles">看柱顶与弧形腰线</button>
      <button type="button" data-view="rail">看上廊的铁栏</button>
