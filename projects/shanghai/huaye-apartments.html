<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>华业公寓主楼 · H形住宅与中央红瓦塔</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-oblique="negative-x" aria-label="华业公寓H形主楼及中央红瓦塔三维模型"></main>
  <header>
    <a href="index.html#landmark=jingan-huaye-apartments&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">静安区 · 陕西北路175号</p>
    <h1>华业公寓主楼</h1>
    <p>H形住宅与中央红瓦塔</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">模型参考2015年地面照片、2019年航拍及历史东面鸟瞰。主楼外观、屋顶与阳台尺度为估计。院内两栋四层配楼另列。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">西南立面</button>
      <button type="button" data-view="oblique">斜侧面</button>
      <button type="button" data-view="above">上方俯视</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/jingan-huaye-apartments/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('jingan-huaye-apartments');
  </script>
</body>
</html>
