  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">市房管局将这幢四层住宅登记为1920年代建筑。沿两条街面与三面折角可见50处窗洞，瓦顶两翼在角塔处相接。长治路一侧，三座圆拱组成门廊。山花下的半圆扇窗和三扇旧方窗另成一组，方窗到2021年已封。</p>
