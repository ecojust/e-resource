<p class="scope">两樘四扇百叶宽窗夹着双门。每扇宽窗的百叶分三段，各有十一片。窄窗下的卷草比临街墙面略为凸出。</p>

<p>临街低屋之后，还能看到横向分缝、两级瓦檐和窄窗下的阶梯饰板。立面的尺寸来自2019年照片和2020年街景的窗缘比对。隐蔽屋深为估算值。相邻小山墙与主楼的连接和产权边界仍待考。</p>
