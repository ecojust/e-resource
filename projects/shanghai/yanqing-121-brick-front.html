<p>延庆路121号列入第五批上海市优秀历史建筑，编号5D043。2018年照片保留了临街窗位、砖带和券口，2015年的街景用于估算尺度。树木和设备遮挡的砖芯依同墙可见处补全，门窗的绝对尺寸约有0.25至0.45米误差。模型范围止于照片可辨的临街面。</p>
