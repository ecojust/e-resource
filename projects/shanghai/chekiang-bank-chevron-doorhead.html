    <h1>浙江实业银行大楼福州路入口折线门楣与串珠</h1>
      <p>107号矩形门洞的深色金属门楣，中央三层向下叠合的人字折线，下方见斜面，两边各有带圆饰与串珠的阶形垂板。</p>
