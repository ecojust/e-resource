<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>东方百代唱片公司办公楼 · 衡山路811号</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-front="positive-z" data-oblique-x="-.66"
        aria-label="百代小楼北入口、南花园柱廊、砖墙与瓦顶"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">徐汇区 · 衡山路811号</p>
    <h1>东方百代唱片公司办公楼</h1>
    <p>百代小楼 · 今义勇军进行曲灌制地纪念馆</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">北面楼梯间的拱窗下方是扇贝形雨篷。绕到花园，可见两组爱奥尼双柱和东端上下相叠的拱窗。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看北入口</button>
      <button type="button" data-view="oblique">斜看红砖主楼</button>
      <button type="button" data-view="above">俯看坡顶与老虎窗</button>
      <button type="button" data-view="inscription">近看高窗与雨篷</button>
      <button type="button" data-view="return">转看南花园柱廊</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/xuhui-pathe-records-office/README.md">市级名录、四面实照与尺度</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('xuhui-pathe-records-office', {
      inscription: {center: [.24, 4.83, .43], size: [5.1, 8.5, 2.1], direction: [-.12, .055, 1]},
      return: {center: [1.8, 2.28, -14.43], size: [9.8, 4.65, 2.5], direction: [.12, .11, -1]},
    });
  </script>
