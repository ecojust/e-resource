  <link rel="icon" href="assets/favicon.svg">

<body>
  <main id="model-view" data-oblique="positive-x" data-oblique-x="0.35" aria-label="礼和洋行九江路街面三维模型"></main>
  <header>
    <a href="index.html#landmark=huangpu-carlowitz-jiujiang-front&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">黄浦区 · 江西中路255号</p>
    <h1>礼和洋行九江路街面</h1>
    <p>底层券廊 · 透空石栏 · 三座山花</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">九江路上的四层红砖街面保存了连续浅券窗、透空栏板与街角圆窗。底层外廊可从路口进入。模型呈现修缮后的南立面和近端圆角。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">九江路立面</button>
      <button type="button" data-view="oblique">江西中路街角</button>
      <button type="button" data-view="above">山花和老虎窗</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-carlowitz-jiujiang-front/README.md">制作范围与照片来源</a>
