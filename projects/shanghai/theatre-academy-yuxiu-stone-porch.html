    <h1>上海戏剧学院毓琇楼弧形门罩与夹墙石阶</h1>
      <p>毓琇楼入口有四级直跑石阶，两边带矮坡墙和方形前墩。两根砖墩托起中央浅弧、两端平直的门罩，白色拱腹下悬小灯。模型截到门框和左扇，下部四阶及两侧石墙保留进深。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">依据两次入院实拍及校方导览。梯段名义净宽1.84米，据正面照片比例估算踏步高和门罩进深；原门上彩色玻璃的纹样未重绘。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看四级石阶与门罩</button>
      <button type="button" data-view="oblique">看斜坡夹墙和前墩</button>
      <button type="button" data-view="tiles">看弧面门罩下腹</button>
      <button type="button" data-view="rail">看左扇与入口</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
