    <h1>自忠路424、426号临街二层双砖券与木窗</h1>
      <p>两块绿门牌上方的两跨红砖券。面街左侧426号为两扇合拢的百叶，右侧424号可见打开的木框、暗色窗洞。双跨之间的竖管经过券肩，白色凸窗台分别位于两窗下方。</p>
  </header>

    <p class="scope">采用2020年街景球面转切面后按两处起拱点与窗台校准。两跨合计名义宽3.60米。照片能约束相对几何，开间、厚度和窗扇角度仍为估计。</p>
