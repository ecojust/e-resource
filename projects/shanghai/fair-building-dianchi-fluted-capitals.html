    <h1>公平大楼滇池路巨柱柱头与三槽檐带</h1>
      <p>滇池路街面巨柱的上端有石刻竖槽，圆形柱颈上承曲面的柱头和方石板。两根相邻柱头之上的檐梁留有成组三道的短竖槽，顶缘分层挑出。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">取相邻两根巨柱的上端和其间一跨檐梁。柱径按照片估约0.55米，柱距约1.78米；竖槽的数量、石材颜色和线脚深度按街面可辨轮廓近似。此为局部细节，未测整楼尺寸。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">看双柱头</button>
      <button type="button" data-view="oblique">看圆形柱颈</button>
      <button type="button" data-view="tiles">看檐带短槽</button>
      <button type="button" data-view="rail">看挑出檐缘</button>
