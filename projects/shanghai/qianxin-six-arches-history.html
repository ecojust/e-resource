<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>谦信大楼 · 江西中路中央六券窗廊</title>
<link href="assets/favicon.svg" rel="icon"/>
<link href="src/dacheng-hall.css" rel="stylesheet"/>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
    .embedded header,.embedded footer{display:none}
    .embedded #model-view{top:8px;bottom:8px}
    .embedded .panel{top:12px;bottom:12px}
    .embedded #site-return{display:block;margin-top:8px}
    @media(max-width:650px){.embedded #model-view{inset:0 0 46%}.embedded .panel{top:54%;bottom:0;max-height:none}}
  </style>
<script>
    if(window.self!==window.top && new URLSearchParams(location.search).get('embed')==='history'){
      document.documentElement.classList.add('embedded');
      const returnToMap=event=>{event.preventDefault();parent.postMessage('close-historical-view',location.origin);};
      addEventListener('keydown',event=>{if(event.key==='Escape') returnToMap(event);});
      addEventListener('DOMContentLoaded',()=>{
        const link=document.getElementById('site-return');
        link.textContent='返回当代原址';
        link.addEventListener('click',returnToMap);
        document.querySelector('.panel').append(link);
      });
    }
  </script>
</head>
<body>
<main aria-label="谦信大楼两层六券窗廊三维模型" data-oblique-x=".57" id="model-view"></main>
<header>
<a href="index.html#landmark=huangpu-qianxin-building-historic-front&amp;mode=overview" id="site-return">← 查看当代原址</a> · <a href="landmarks.html#building-huangpu-qianxin-building-historic-front">按区目录</a>
<p>第三批优秀历史建筑 · 江西中路138号</p>
<h1>谦信大楼</h1>
<p>江西中路中央六券窗廊</p>
</header>
<aside aria-label="模型操作与下载" class="panel">
<p>这件外墙模型依据2015年2月17日的公开街照制作。上下两排各三券，下排有三段透空石栏。窗框和花饰的尺寸按图估算。</p>
<label for="detail">模型细节</label>
<select id="detail">
<option value="auto">随距离切换</option>
<option value="full">完整近景</option>
<option value="lod">简化远景</option>
</select>
<div class="buttons">
<button data-view="front" type="button">正看两层六券</button>
<button data-view="oblique" type="button">斜看红砖拱腹</button>
<button data-view="above" type="button">俯看下层石栏</button>
<button hidden="" id="retry" type="button">重新加载</button>
</div>
<p aria-live="polite" id="status" role="status">正在读取模型…</p>
