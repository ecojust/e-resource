<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>董家渡天主堂 · 南入口立面</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-oblique="positive-x" aria-label="董家渡天主堂历史南入口立面三维模型"></main>
  <header>
    <a href="index.html#landmark=huangpu-dongjiadu-cathedral&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">黄浦区 · 董家渡路</p>
    <h1>董家渡天主堂南入口</h1>
    <p>董家渡路一侧的双塔、钟面、楹联与门厅</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">依据2010及2012年实拍制作，表现2017年基础加固前的正面。高低门、壁龛、百叶钟塔及中央十字架可分辨。尺寸及人物细部为估算。主堂后部、附楼和院落另列。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">董家渡路南面</button>
      <button type="button" data-view="oblique">斜侧面</button>
      <button type="button" data-view="above">上方俯视</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-dongjiadu-cathedral/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';

  </script>
