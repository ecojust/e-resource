<p class="eyebrow">徐汇区 · 复兴西路26、28号</p><h1>白赛仲公寓</h1>
</header>
<main aria-label="白赛仲公寓三维模型" id="model-view"></main>
<aside aria-label="观察机位与模型下载" class="panel">
<p class="scope">公寓建在复兴西路和乌鲁木齐中路的街角。两条街翼之间的截角容纳了两扇入口和四层凹阳台。楼梯平台可以近看水磨石踏步与曲卷铁栏杆。</p>
<label for="detail">模型细节</label>
<select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
<label for="garage-period">乌鲁木齐中路底层门面</label>
<select id="garage-period"><option value="modern">街景所见的店铺</option><option value="1930s">1930年代汽车间</option></select>
<p id="period-status" role="status" aria-live="polite"></p>
<div class="buttons" id="model-cameras" aria-label="摄影与模型机位"></div>
<button hidden="" id="retry" type="button">重新加载</button>
<p aria-live="polite" id="status" role="status">正在读取模型…</p>
<div aria-label="下载模型" class="downloads" id="downloads"></div>
<p>原平面和约138平方米的占地用于估算尺度。屋顶高程由街角照片和航片推算。历史门扇依据黑白底片复建，采用中性灰色。</p>
<p><a href="https://m.thepaper.cn/newsDetail_forward_22555305">上海市房管局的历史平面与修缮资料</a> · <a href="https://commons.wikimedia.org/wiki/File:Baisaizhong_Gongyu.JPG">2015年照片</a> · <a href="https://collections.lib.uwm.edu/digital/collection/agsphoto/id/16659/rec/11">原汽车间底片</a></p>
