    <h1>胶州路125弄住宅院侧小山墙、红瓦和六格木窗</h1>
      <p>胶州路125弄住宅的院墙正面以浅粉色抹灰小山墙收头，两侧是黑色铁门。模型取墙头往院内延伸的四皮红瓦，以及画面左侧一樘双扇六格红木窗。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">依据2017年原照量取山尖、檐口、窗台与两道铁门的相对位置。山墙名义宽1.64米，瓦片搭接、灰缝和窗洞进深依据斜照估计。</p>
    <label for="detail">模型细节</label>

      <button type="button" data-view="tiles">看屋脊与瓦口</button>
