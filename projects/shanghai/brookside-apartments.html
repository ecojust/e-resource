<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>枕流公寓</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-front="positive-z" data-oblique-x="0.12" aria-label="枕流公寓南花园面与中央透空券列"></main>
  <header>
    <a href="index.html#landmark=jingan-brookside-apartments&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">静安区 · 华山路731号</p>
    <h1>枕流公寓</h1>
    <p>南花园折翼、中央透空券列与凸窗</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">七层楼体的两翼转向南花园。2019年航拍和2023年地面照片分别记录了屋顶转折与中央券列，华山路一侧参考2020和2021年的街景。隐蔽窗列按比例估计。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">花园正面</button>
      <button type="button" data-view="oblique">花园斜视</button>
      <button type="button" data-view="above">屋顶券列</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/jingan-brookside-apartments/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js?v=asia-building-v1';
    showCandidateAssetViewer('jingan-brookside-apartments');
  </script>
</body>
</html>
