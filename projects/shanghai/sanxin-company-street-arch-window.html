<body>
  <main id="model-view" aria-label="中新公司大楼沿街石券窗与铁窗栅"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">黄浦区 · 江西中路421号</p>
    <h1>中新公司大楼</h1>
    <p>沿街石券窗与铁窗栅</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">两期街景都有底层券窗、分缝石墩和细密铁栅。铁栅立在窗框之前，窗台以下留有横长的浅槽。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看券窗和铁栅</button>
      <button type="button" data-view="oblique">斜看窄直栅和玻璃退进</button>
      <button type="button" data-view="above">俯看放射形券石</button>
      <button type="button" data-view="arch">细看石墩灰缝与叠线窗台</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-sanxin-company-street-arch-window/README.md">历史照片与制作范围</a>
  </aside>
