  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">沿河的两层灰砖长厅曾是工厂食堂，如今陈列益民食品一厂的厂史。西北、东南两端各有四扇上窗和两道中央玻璃门。沿街长墙的第六、七开间保留了落地木门，门扇上可见凸起的芯板。</p>

<button type="button" data-view="return">看西北双门</button>
<button type="button" data-view="gable">看东南双门</button>
<button type="button" data-view="middle">从桥侧看</button>
