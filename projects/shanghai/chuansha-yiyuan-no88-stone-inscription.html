    <h1>川沙以园北城壕路88号四字石额</h1>
      <p>88号门上方有一块横向浅色石额。槽内四组旧字留有阴影，匾外从高起的窄唇，经斜面、圆线和小凹线退入字面。模型保留在2018年和2021年两张照片上都能辨认的字形和框线。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">2021年照片中匾高约九个砖皮。取每皮约6.6厘米作展示尺度，外框约1.86×0.60米；石额的真实厚度、浅浮雕深度及已磨失的笔端仍是估计。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">看全匾与框线</button>
      <button type="button" data-view="oblique">斜看石框截面</button>
      <button type="button" data-view="tiles">看左半匾旧刻</button>
      <button type="button" data-view="rail">看右半匾旧刻</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div class="downloads" id="downloads"></div>
    <a href="source/precise/pudong-chuansha-yiyuan-no88-stone-inscription/README.md">史料、测量与模型范围</a>
  <p>四字石刻见 <a href="https://k.sina.com.cn/article_6430516229_17f49e405001002jbj.html">2018年石额近照</a> 和 <a href="https://www.dutiger.com/thread-1171-1-1.html">2021年88号实照</a>。原创模型采用 <a href="https://opensource.org/license/mit/">MIT许可</a>。</p></aside>
