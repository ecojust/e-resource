<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>东平路5号花园住宅 · 南立面双层敞廊</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-front="positive-z" data-oblique-x="-.66"
        aria-label="南园底层三座大拱与二层五座小拱"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">徐汇区 · 东平路5号</p>
    <h1>东平路5号花园住宅</h1>
    <p>南立面双层敞廊</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">南面三座大拱中，红色台阶从中央开口通向敞廊。抬头可见上层五联券下的白色圆柱和瓶式栏杆。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看三券与五券</button>
      <button type="button" data-view="oblique">斜看南敞廊</button>
      <button type="button" data-view="above">俯看坡檐与老虎窗</button>
      <button type="button" data-view="inscription">近看上层瓶式栏杆</button>
      <button type="button" data-view="return">转看中央拱下台阶</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/xuhui-dongping-five-south-arcade/README.md">南立面照片、栏杆比例与模型资料</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('xuhui-dongping-five-south-arcade', {
      inscription: {center: [1.67, 4.82, -.05], size: [3.25, 2.05, .55], direction: [.27, .07, 1]},
      return: {center: [0, 1.88, -.15], size: [5.10, 3.43, 2.35], direction: [-.42, .03, 1]},
    });
  </script>
</body>
</html>
