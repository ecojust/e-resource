    <p>门廊与石阶</p>

  <aside class="panel" aria-label="模型操作与下载">

      <button type="button" data-view="front">正看柱廊与楼梯窗</button>
      <button type="button" data-view="oblique">斜看石阶与扶手</button>
      <button type="button" data-view="above">俯看雨篷与石阶</button>
      <button type="button" data-view="inscription">细看绿色特号牌</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/yangpu-fangsan-special-number-entrance/README.md">历史照片与制作范围</a>
