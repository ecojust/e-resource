<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>武夷路174号花园住宅 · 上海历史建筑</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <style>
    @media (max-width:650px) {
      body {display:grid;grid-template-rows:auto minmax(250px,46svh) auto auto;min-height:100svh}
      header,.panel,footer,#model-view {position:static}
      header {padding:10px 16px 5px}
      #model-view {min-width:0;overflow:hidden}
      .panel {margin:0 10px;max-height:none;overflow:visible}
      footer {padding:6px 16px}
    }
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">长宁区 · 武夷路168号翡悦里</p><h1>武夷路174号花园住宅</h1>
  </header>
  <main id="model-view" aria-label="武夷路174号住宅和北庭"></main>
  <aside class="panel" aria-label="观察机位与模型下载">
    <p class="scope">券门和三扇凸窗共用一座铁艺阳台。转到花园一面，可见弧形落地门窗，上方两座老虎窗分别覆浅坡顶和斜屋顶。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="oblique">街侧与整栋</button><button type="button" data-view="street">临街木格山墙</button>
      <button type="button" data-view="entrance">券门与阳台铁艺</button><button type="button" data-view="dormer">街侧老虎窗与烟囱</button>
      <button type="button" data-view="garden">花园立面</button><button type="button" data-view="garden-bay">弧形玻璃门窗</button>
      <button type="button" data-view="roof">俯看屋顶</button><button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads" aria-label="下载模型"></div>
    <p><a href="source/precise/changning-wuyi-174-dongliang-garden-villa/README.md">建筑、年代与估算范围</a> · <a href="source/precise/changning-wuyi-174-dongliang-garden-villa/SOURCES-LICENSE.md">照片来源</a></p>
    <p><a href="data/audit/wuyi-174-dongliang-garden-villa-v1/README.md">查看模型复核</a></p>
  </aside>
  <footer>拖动旋转 · 滚轮或双指缩放</footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    const id='changning-wuyi-174-dongliang-garden-villa';
    const size={overview:[18,13,19],street:[9.5,11,.5],entrance:[6.7,4.8,.4],dormer:[11,5,6],
      garden:[17,11,1],'garden-bay':[6.2,5.5,1],roof:[18,4,17]};
    const gltf=([x,y,z])=>[x,z,-y];
    try {
      const response=await fetch('source/precise/'+id+'/source/cameras.json');
      if (!response.ok) throw Error('观察机位读取失败');
      const poses=await response.json();
      const views={};
      for (const {name,eye,target} of poses) {
        views[name==='overview'?'oblique':name]={center:gltf(target),size:size[name],
          direction:gltf(eye.map((v,i)=>v-target[i]))};
      }
      showCandidateAssetViewer(id,views);
    } catch (error) {
      const retry=document.querySelector('#retry');
      document.querySelector('#status').textContent=error.message;
      retry.hidden=false;retry.onclick=()=>location.reload();
    }
  </script>
</body>
</html>
