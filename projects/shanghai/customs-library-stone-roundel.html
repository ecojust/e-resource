    <h1>江海图书馆海关楼门侧石徽与斜带束柱</h1>
      <p>取海关楼入口画面左侧石墩上部。方凹框内的圆形雕饰带双层石边；两侧各有一束细棱，由三道斜束带箍起，上方多道水平石线向外挑出。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">据2018年两张正反斜照和2025年报道的正面照片量取可见比例。石墩名义宽1.44米；石徽表面参照原照局部明暗，雕刻深度未实测，模型所示仅为近似起伏。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>

      <button type="button" data-view="front">正看石徽和两束柱</button>
      <button type="button" data-view="oblique">斜看石墩压顶</button>
      <button type="button" data-view="tiles">看圆徽凹框</button>
      <button type="button" data-view="rail">看三道斜束带</button>
      <button type="button" id="retry" hidden>重新加载</button>
