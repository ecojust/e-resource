  <link rel="icon" href="assets/favicon.svg">

<body>
  <main id="model-view" data-oblique="negative-x" aria-label="美琪大戏院修缮后的两条临街立面三维模型"></main>
  <header>
    <a href="index.html#landmark=jingan-majestic-theatre&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">静安区 · 江宁路与奉贤路路口</p>
    <h1>美琪大戏院</h1>
    <p>修缮后的两条临街立面</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">圆角玻璃门厅连接江宁路与奉贤路上的两片外墙。模型参考2017年修缮后的日景与夜景照片，屋顶轮廓、侧墙尺寸及遮挡处为估计。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">奉贤路立面</button>
      <button type="button" data-view="oblique">斜侧面</button>
      <button type="button" data-view="above">上方俯视</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/jingan-majestic-theatre/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
