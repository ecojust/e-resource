    <h1>四明别墅临愚园路红瓦坡与四扇阁楼窗</h1>
      <p>临愚园路一排住宅的屋面局部。四扇赤褐色窄窗并列，浅色窗侧墙压到红色瓦坡上，窄横木窗台与坡檐在前后两个平面。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">窗洞名义宽2.64米。两处2020年街景对同一窗台右下角的高程估算相差约0.5米。窗扇高度、侧墙厚度和瓦件曲率依可见轮廓估计；被电缆遮挡的格条以同扇可辨部分续接。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看四扇阁楼窗</button>
      <button type="button" data-view="oblique">斜看窗侧墙与瓦坡</button>
      <button type="button" data-view="tiles">看窗扇细格</button>
      <button type="button" data-view="rail">看搭接瓦脊与窗台</button>
