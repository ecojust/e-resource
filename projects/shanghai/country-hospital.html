<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宏恩医院 · 花园立面</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" aria-label="宏恩医院花园立面三维模型"></main>
  <header>
    <a href="index.html#landmark=jingan-country-hospital&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">静安区 · 延安西路221号</p>
    <h1>宏恩医院</h1>
    <p>历史主楼 · 朝花园一侧</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">花园立面有三处山花，两段窗墙下方为拱廊。开间排列参照 1920 年代档案照片，中央门廊的色彩与细部参照 2015 年照片。楼层标高和进深为估计，本次范围止于花园立面。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">花园正面</button>
      <button type="button" data-view="oblique">斜侧面</button>
      <button type="button" data-view="above">上方俯视</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/jingan-country-hospital/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module" src="src/country-hospital.js"></script>
</body>
</html>
