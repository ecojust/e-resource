<body>
  <main id="model-view" data-front="positive-z" data-oblique-x="-.66"
        aria-label="沿庭院突出的双阳台、扁拱门洞和屋顶分户墙"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>

  <aside class="panel" aria-label="模型操作与下载">

    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>

      <button type="button" data-view="front">正看两户阳台</button>
      <button type="button" data-view="oblique">斜看庭院立面</button>
      <button type="button" data-view="above">俯看屋脊分户墙</button>
      <button type="button" data-view="inscription">近看阳台铁花</button>
      <button type="button" data-view="return">转看底层券门</button>
      <button type="button" id="retry" hidden>重新加载</button>

    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/xuhui-libo-terrace-one-two-balconies/README.md">两排门牌、摄影方向与阳台尺寸</a>

    showCandidateAssetViewer('xuhui-libo-terrace-one-two-balconies', {
