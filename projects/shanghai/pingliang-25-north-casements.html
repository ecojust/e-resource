    <h1>平凉路25号住宅北立面第三开间外悬亮窗与石壁柱</h1>
      <p>北立面第三开间的上亮为四列两行钢窗，底边向街面外悬。下部左右两扇由窄红钢梃分格，右扇外开。两根石壁柱的窄凹板上端有浅帽檐。</p>
