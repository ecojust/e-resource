  <link rel="icon" href="assets/favicon.svg">

<body>
  <main id="model-view" aria-label="天赐大宅旧舞厅一跨天花，默认从下方观看"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">徐汇区 · 淮海中路1209号</p>
    <h1>天赐大宅</h1>
    <p>舞厅圆形顶饰与弧肋</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">根据早期舞厅内景重建一跨天花。仰看亮色圆饰四周的阶状环边，转动可见横向肋带如何连接两侧弧顶。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">从下方看全跨</button>
      <button type="button" data-view="oblique">斜看圆饰与侧弧</button>
      <button type="button" data-view="above">看横肋与起拱檐线</button>
      <button type="button" data-view="inscription">放大圆饰阶边</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/xuhui-adeodata-hall-ballroom-ceiling-bay/README.md">舞厅历史图版与制作范围</a>
