<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>密丹公寓武康路与湖南路转角立面</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-oblique="positive-x" data-oblique-x="0.76" aria-label="密丹公寓武康路与湖南路转角立面模型"></main>
  <header>
    <a href="index.html#landmark=xuhui-midget-apartments&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">徐汇区 · 武康路115号</p>
    <h1>密丹公寓武康路与湖南路转角立面</h1>
    <p>从武康路与湖南路路口看向两排横窗和阶梯挑块</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">2013、2015和2026年的街照都能辨认切角上的两樘窄顶窗、两组横窗，以及二层深窗两旁的阶形挑块。模型包括街角和两段侧墙，首层店面依据2026年照片制作，后院及室内另待考证。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">路口正面</button>
      <button type="button" data-view="oblique">斜看凸窗与阶形挑块</button>
      <button type="button" data-view="above">俯看切角和短侧墙</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/xuhui-midget-apartments/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('xuhui-midget-apartments');
  </script>
</body>
</html>
