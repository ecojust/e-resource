    <h1>卡德大楼街面阳台的四排横槽与转角铁栏</h1>
      <p>取石门二路50号卡德大楼临街阳台的左端与中段。女儿墙上连续四排穿孔，左端一道开孔折回侧面；低铁栏沿墙顶折转。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">据Fayhoo于2015年拍摄的卡德公寓全景量取横槽分组、铁栏与楼板的相对比例。取样正面名义宽5.53米，楼板深度、孔口截面和铁杆直径为估计。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看四排横槽</button>
      <button type="button" data-view="oblique">看阳台转角</button>
      <button type="button" data-view="tiles">看孔口与铁栏</button>
      <button type="button" data-view="rail">看楼板下的短托</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
