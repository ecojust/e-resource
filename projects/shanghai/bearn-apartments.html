<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>培文公寓</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-oblique="negative-x" data-oblique-x="-0.66" aria-label="培文公寓淮海中路街面、重庆南路圆角与退台塔冠模型"></main>
  <header>
    <a href="index.html#landmark=huangpu-bearn-apartments&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">黄浦区 · 淮海中路449号</p>
    <h1>培文公寓</h1>
    <p>沿街凸窗、东端圆角与阶梯塔冠</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">培文公寓于1930年竣工。淮海中路的六层长街面向东转入圆角，中段逐层退至九层。窗带、挑檐和屋顶题字参照档案照片及2014年8月街照制作。模型止于沿街一带，后翼和院内另两栋住宅另列。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">淮海中路正面</button>
      <button type="button" data-view="oblique">东端弧形窗带</button>
      <button type="button" data-view="above">退台与塔冠</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-bearn-apartments/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('huangpu-bearn-apartments');
  </script>
</body>
</html>
