<head>

<body>
  <main id="model-view" data-front="positive-z" data-oblique-x=".55" aria-label="明复楼门厅方柱、铜色扭绳与镶蓝色社徽"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">黄浦区 · 陕西南路235号</p>
    <h1>明复图书馆明复楼</h1>
    <p>中国科学社 · 门厅社徽双柱</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">门厅两根方柱的柱头嵌有中国科学社社徽。放大可看题字、望远镜、天平和铜色扭绳。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看门厅双柱</button>
      <button type="button" data-view="oblique">斜看门厅双柱</button>
      <button type="button" data-view="above">俯看双柱与梁头</button>
      <button type="button" data-view="inscription">放大社徽题字</button>
      <button type="button" data-view="return">转看柱头内侧</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>

      return: {center: [-0.87, 3.14, 0.17], size: [0.64, 0.59, 0.60], direction: [0.74, 0.18, 0.94]},
