    <p class="eyebrow">徐汇区 · 第五批优秀历史建筑 5D011</p><h1>开普敦公寓</h1>
  </header>
  <main id="model-view" aria-label="开普敦公寓三维模型"></main>
  <aside class="panel" aria-label="观察机位与模型下载">
    <p class="scope">武康路240–246号。1940年建成的公寓占据街角窄地。三层圆套方窗沿南端排列，与中央的宽钢窗和圆角横窗呼应。模型按2024年刊发的修缮后实景制作。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="overview">武康路立面</button>
      <button type="button" data-view="bow">南端圆角与舷窗</button>
      <button type="button" data-view="porthole">圆套方窗</button>
      <button type="button" data-view="centre">三层中央凸窗</button>
      <button type="button" data-view="pairs">北部并列钢窗</button>
      <button type="button" data-view="stair">北侧窄直窗</button>
      <button type="button" data-view="ground">水刷石底层</button>
      <button type="button" data-view="roof">三角形平屋顶</button>
      <button type="button" data-view="plan">1947年地形轮廓</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
