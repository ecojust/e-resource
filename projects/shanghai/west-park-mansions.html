<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>西园大厦</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-front="positive-z" data-oblique-x="-0.37" aria-label="西园大厦的花园立面与屋顶花架"></main>
  <header>
    <a href="index.html#landmark=changning-west-park-mansions&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">长宁区 · 愚园路1396号</p>
    <h1>西园大厦</h1>
    <p>花园浅拱阳台、端部花架与长宁路窗井</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">2014年的庭院照片中，三组宽浅拱上方有六个窄窗位，两端各立一座透空花架。早期敞开的阳台后来陆续装窗。北面凹入的窗井依2021年长宁路街景制作，公寓内部和修缮后的个别窗式仍待核实。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">花园正面</button>
      <button type="button" data-view="oblique">西南斜视</button>
      <button type="button" data-view="above">屋顶花架</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/changning-west-park-mansions/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js?v=asia-building-v1';
    showCandidateAssetViewer('changning-west-park-mansions');
  </script>
</body>
</html>
