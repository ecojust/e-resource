<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>企业大楼 · 原中国企业银行</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="src/dacheng-hall.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="model-view" data-oblique-x="-.42" aria-label="四川中路33号企业大楼三维模型"></main>
  <header>
    <a href="index.html#landmark=huangpu-enterprise-building&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">黄浦区 · 四川中路33号</p>
    <h1>企业大楼</h1>
    <p>1931年 · 原中国企业银行</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">黄褐色面砖壁柱将临街面分成七个开间。中央入口保留“创业大楼”题字，头顶是逐级收起的山字形女儿墙。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">四川中路东立面</button>
      <button type="button" data-view="oblique">斜侧面</button>
      <button type="button" data-view="above">上方俯视</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-enterprise-building/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>
  <script type="module">
    import {showCandidateAssetViewer} from './src/candidate-asset-viewer.js';
    showCandidateAssetViewer('huangpu-enterprise-building');
  </script>

</html>
