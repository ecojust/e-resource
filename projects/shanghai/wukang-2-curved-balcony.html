<body>
  <main id="model-view" aria-label="面向花园的弧形阳台和塔司干双柱"></main>
  <header>
    <a href="landmarks.html">← 上海历史建筑目录</a>
    <p class="eyebrow">徐汇区 · 武康路2号</p>

    <p>南向弧形阳台与双柱</p>

  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">花园一侧的双柱托起弧形阳台。浅色分隔柱之间嵌着绿色椭圆栏片，柱后是内退的入口。</p>

      <button type="button" data-view="front">从花园看双柱</button>
      <button type="button" data-view="oblique">斜看阳台挑出</button>
      <button type="button" data-view="above">近看绿色椭圆栏片</button>
      <button type="button" data-view="capital">查看柱头与托板</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div class="downloads" id="downloads"></div>
    <a href="source/precise/xuhui-wukang-2-garden-villa-curved-balcony/README.md">史料、测量与模型范围</a>
