    <h1>松韵别墅总弄转角扇砖窗楣与木窗上扇</h1>
      <p>松韵别墅总弄转角楼的二层，木窗上方以红褐色立砖排成扇形，外圈另砌窄券。窗楣以上保留一段齿砖檐口，以下可见一对方形上窗与下扇上部。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">依据2017年8月Antigng拍摄的《松韵别墅总弄》全幅原照，以窗框四个交点校正透视。暂按窗框宽1.26米、上扇高0.73米换算。穿过下窗的电缆后方和转角另一扇窗均超出本件取样范围。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
