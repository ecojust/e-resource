  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">这幢公寓是1932年成立的野风画会旧址。24号门牌旁是红砖拱券，弧形凸窗沿楼层向上接到敞廊。门内的红色箱体、门前四级台阶和中央窄坡取自另一张能看全入口的照片。</p>
