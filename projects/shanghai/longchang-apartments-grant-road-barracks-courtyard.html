<p class="scope">五层砖墙围合成一座斜四边庭院。上部四层外廊向院心开敞，两座混凝土梯塔在长翼间相对。2012年照片可辨362号门牌、石门套和铁栅双扇。模型将门套示意置于65.72米街面的中点，实际沿街位置仍待考。</p>
