    <h1>福世花园园侧折线浅拱敞廊与铁栏</h1>
      <p>花园一侧二层敞廊的五段折线券底、外挑窗台、分叉花铁栏和后退的两樘玻璃门窗。</p>

    <p class="scope">廊口按照片比例估计，净宽约3.58米，栏顶高约1米，后排门窗与栏杆相距约1.2米。被树枝和衣物遮挡的栏花间距与末端以照片中的重复间距推估。两张同栋照片可核，具体门牌缺独立可读证据。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
