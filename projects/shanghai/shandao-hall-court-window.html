    <p class="eyebrow">静安区 · 巨鹿路709号</p>
    <h1>善道堂旧址院门旁二层错石窗套与铁花格窗</h1>
      <p>复原巨鹿路709号院门东侧临街二层的一樘窗。短长交错的石块从深灰粒石墙镶入窗侧；窗下两扇铁花各自有卷头、弯叶和直杆，上亮另有连续线脚。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">据2019年5月与2020年2月两次街景辨认窗框和交错八皮石材。模型窗宽约1.48米，未实测绝对尺寸；进深与颗粒分布按阴影和正面比例估计。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">正看错石窗套与铁花</button>
      <button type="button" data-view="oblique">斜看窗框与石带</button>
      <button type="button" data-view="tiles">看铁花涡卷和弯叶</button>
      <button type="button" data-view="rail">看两种长度的侧石</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
