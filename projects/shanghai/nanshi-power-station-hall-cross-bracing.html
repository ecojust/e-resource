    <h1>南市发电厂主厅右侧上下两层钢交叉撑</h1>
      <p>花园港路200号主厅的一个墙跨，两层深灰钢斜撑、连接两段的横向工字梁、两侧柱面和灰色分带。两层交点均可辨认；上部左端被梁遮住，模型在照片可见处截止。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">原照记录等效焦距24毫米。取两侧柱间约4米作为名义尺度，单照反投影给出两层净高合计约5.22米。开间、型钢厚度和杆件前后错位均待现场测量。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">看主厅两层钢撑</button>
      <button type="button" data-view="oblique">看上层交叉搭接</button>
      <button type="button" data-view="tiles">看下层交叉搭接</button>
      <button type="button" data-view="rail">看横梁翼缘与柱面</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div class="downloads" id="downloads"></div>
