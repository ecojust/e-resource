    <h1>三多里53号石库门门楣双花盆、齿饰与挑檐</h1>
      <p>两盆带竖棱的石刻盆栽夹住一块低平的石匾。上面一排短齿托住挑出的檐线，中央另有带卷茎花饰的上匾。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">据高参88在2015年10月17日发表的成组照片绘制。正面门牌可读53，另两户只参照相同构造。总宽取2.63米为估值；匾上磨损笔画未补，盆栽叶片、卷茎和石刻凸出深度按可见轮廓估算。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>

      <button type="button" data-view="front">看53号门楣</button>
      <button type="button" data-view="oblique">看带棱石花盆</button>
      <button type="button" data-view="tiles">仰看短齿与上匾</button>
      <button type="button" data-view="rail">看侧垛和下檐</button>
