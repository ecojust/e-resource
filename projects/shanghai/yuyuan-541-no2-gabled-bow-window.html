    <h1>愚园路541弄2号木构山墙与弧窗百叶</h1>
      <p>半木构山墙的两道宽梁和竖木，阁楼双扇各三片玻璃。下部凸窗的四组浅色百叶随弧转向，窗头、窗台和中间石框有不同出挑。右端被枝叶挡住，保留相片中能辨的外沿。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">名义山墙宽4.1米；木框用照片像素迹线，凸窗半径1.82米为近似。右侧百叶细部有树遮挡，同组叶距参考中央两组。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>

      <button type="button" data-view="tiles">看阁楼双扇</button>
      <button type="button" data-view="rail">看弧窗百叶</button>
