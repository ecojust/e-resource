<body>
  <main id="model-view" data-oblique-x="0.36" aria-label="会乐精舍花园侧半圆阳台、八字形凸窗与退台模型"></main>
  <header>
    <a href="index.html#landmark=xuhui-willow-court&amp;mode=overview">← 在上海主地图中查看</a>
    <p class="eyebrow">徐汇区 · 复兴西路34号</p>
    <h1>会乐精舍</h1>
    <p>花园侧半圆阳台与半层高主入口</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">会乐精舍建于1934至1935年。半圆台阶托起中央入口，上方叠置暗红色半圆阳台，两翼顶部退为露台。入口两侧是八字形凸窗，东端车道通向后院，西端内阳台在后方有实墙。主楼依1935年外观、总平面和徐汇区房管局刊载的现状照片建模，侧背面开间与楼高为估计。</p>
    <label for="detail">模型细节</label>
    <select id="detail">
      <option value="auto">随距离切换</option>
      <option value="full">完整近景</option>
      <option value="lod">简化远景</option>
    </select>
    <div class="buttons">
      <button type="button" data-view="front">花园正面</button>
      <button type="button" data-view="oblique">半圆阳台及入口</button>
      <button type="button" data-view="above">两翼露台与屋顶</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/xuhui-willow-court/README.md">制作范围与照片来源</a>
  </aside>
  <footer><span>拖动旋转 · 滚轮或双指缩放</span></footer>

  </script>
