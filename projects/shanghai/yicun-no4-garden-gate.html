<p>2008年，东华大学的师生在泰安路76弄4号拜访了贺绿汀的家属。长宁区的历史建筑资料以泰安路76弄亦村整体为登记对象。<a href="https://www.dhu.edu.cn/2008/0616/c7783a115089/pagem.htm">东华大学现场记录</a> · <a href="https://www.shcn.gov.cn/col7698/20231023/1246567.html">长宁区建筑资料</a></p>
<p>2021年发表的弄堂照片和2023年发布的泰安路图记从两个角度拍到同一扇院门。下列原文可对照门框、门牌和山墙窗的位置，两文均未标明摄影日期。<a href="https://sghexport.shobserver.com/html/toutiao/2021/04/26/417857.html">上观号房可圆《寻访上海最美弄堂》</a> · <a href="https://sh.people.com.cn/n2/2023/0106/c350122-40256938.html">人民网·上海转载《深藏不露的上海泰安路》</a></p>
