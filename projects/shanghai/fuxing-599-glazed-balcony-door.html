    <h1>复兴中路599号住宅二层格窗阳台门与细铁栏</h1>
      <p>599号院内住宅的二层露台。狭高的暗红色门上半分成两组格窗，下半是四格浅凹门板；门外挑台的铁栏向侧墙折回。</p>
  </header>
