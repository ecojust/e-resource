    <h1>渔光邨尖顶烟囱</h1>
      <p>屋顶浅色粗粒抹面烟囱。长面三条高低错落的尖券排烟孔，端面一孔，下接方筒与折边金属泛水。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">两座方墩之间的白色栏板以长条透孔构成几何纹样。上、下错位的横档、微凸压边和墩面的矩形线脚可分别查看。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">看三孔长面</button>
      <button type="button" data-view="oblique">近看尖券孔</button>
      <button type="button" data-view="tiles">看端面排烟孔</button>
      <button type="button" data-view="rail">近看折边泛水</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div class="downloads" id="downloads"></div>
