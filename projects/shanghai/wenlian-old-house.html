  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">这座20世纪20年代的花园住宅自1950年起由上海市文联使用。1994年名录在238号登记“意大利总会”，修缮团队据历史地图和照片确认，1941年的总会大礼堂位于东侧另一地块，1995年已拆。模型以1995年照片和2020年修缮竣工后的影像重建南面双层敞廊、切角凸窗及曲顶山花。尺寸和材色按影像估计。</p>
