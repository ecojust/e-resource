    <h1>康定东路85号李宅门廊砖雕拱券</h1>
      <p>修缮前保留的门廊一跨。弧顶的砖券内侧为辐射状砖缝，中段卷叶连续转过拱顶，外圈收一道细凸线。两边各保留一座带叶饰的红砖柱头及其下面可见的砌砖。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">参照修缮记录中的600×400像素局部照片拟合券面两条轮廓。模型所取内券宽约3.10米、柱间名义尺度、砖雕深度与卷叶单元间距均为估算。砖墙在画框处截断，灯、黑色木梁与后室另计。</p>
    <label for="detail">模型细节</label>
