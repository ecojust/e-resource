  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">窗口两侧的红瓦从上部陡坡落向下缘的雨沟。深色双扇窗各分两列玻璃，外部檐口遮住窗头。</p>

      <button type="button" data-view="front">正看双扇格窗</button>
      <button type="button" data-view="oblique">斜看叠瓦与浅色收边</button>
      <button type="button" data-view="above">俯看雨沟和下缓瓦坡</button>
      <button type="button" data-view="arch">细看玻璃短横梃与窗框</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在读取模型…</p>
    <div id="downloads" class="downloads"></div>
    <a href="source/precise/huangpu-shaoxing-three-tiled-dormer/README.md">历史照片与制作范围</a>
