    <h1>泰昌木器公司转角屋顶亭的穹顶与叠檐</h1>
      <p>南京东路740号转角的敞亭。低圆穹顶压在数层折线石檐上，街面几根细柱之间留空；柱下的斜台上有浅浅的折面装饰。</p>
  </header>
  <aside class="panel" aria-label="模型操作与下载">
    <p class="scope">以2016年具名全幅照片及其屋面局部为几何依据。亭檐估宽约2.1米，曲率、进深及相邻柱距按照片比例近似。店侧街摄只能核门面；背面被遮的柱列、设备和广告牌均未复原。</p>
    <label for="detail">模型细节</label>
    <select id="detail"><option value="auto">随距离切换</option><option value="full">完整近景</option><option value="lod">简化远景</option></select>
    <div class="buttons">
      <button type="button" data-view="front">看转角屋顶亭</button>
      <button type="button" data-view="oblique">看折线檐口</button>
      <button type="button" data-view="tiles">看亭柱留空</button>
      <button type="button" data-view="rail">看斜台饰面</button>
      <button type="button" id="retry" hidden>重新加载</button>
