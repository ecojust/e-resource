name: Shanghai v5 frozen build

on:
  push:
    branches: [codex/shanghai-v5-build]

permissions:
  contents: read

concurrency:
  group: shanghai-v5-frozen-build
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'ecojust/e-resource' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-26
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/shanghai-v5-build.yml
            /projects/shanghai/ci/v5/**
            /projects/shanghai/assets/city/manifest.json
            /projects/shanghai/data/heights/height_sources_lock.json
      - id: plan
        run: >-
          python3 projects/shanghai/ci/v5/ci_build.py plan
          --project projects/shanghai
          --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/shanghai-v5-build.yml
            /projects/shanghai/ci/v5/**
            /projects/shanghai/assets/city/manifest.json
            /projects/shanghai/data/heights/height_sources_lock.json
      - name: Fetch only immutable inputs for this shard
        run: >-
          python3 projects/shanghai/ci/v5/ci_build.py inputs
          --project projects/shanghai --mode '${{ matrix.mode }}'
          --shard '${{ matrix.shard }}' --apply-sparse
          --output "$RUNNER_TEMP/shanghai-inputs.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Install exact wheel hashes and compressor bytes
        run: |
          python -m venv "$RUNNER_TEMP/shanghai-venv"
          "$RUNNER_TEMP/shanghai-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r projects/shanghai/ci/v5/requirements.lock
          python projects/shanghai/ci/v5/ci_build.py install-npm
          npm ci --prefix projects/shanghai/ci/v5/tooling --ignore-scripts --no-audit --no-fund
      - name: Calibrate decoded bytes, then build assigned completed macros
        run: >-
          "$RUNNER_TEMP/shanghai-venv/bin/python" projects/shanghai/ci/v5/ci_build.py build
          --project projects/shanghai --mode '${{ matrix.mode }}' --shard '${{ matrix.shard }}'
          --output "$RUNNER_TEMP/shanghai-output"
          --summary "$RUNNER_TEMP/shanghai-summary.json"
      - name: Publish immutable assets to a unique non-live branch
        run: >-
          "$RUNNER_TEMP/shanghai-venv/bin/python" projects/shanghai/ci/v5/ci_build.py publish
          --repo "$GITHUB_WORKSPACE" --summary "$RUNNER_TEMP/shanghai-summary.json" --push
